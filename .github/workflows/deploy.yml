name: Deploy Astro Site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: true

# OIDC token permissions for AWS auth
permissions:
  id-token: write
  contents: read

env:
  SITE_DIR: site
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_REGION: us-east-1
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.SITE_DIR }}/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.SITE_DIR }}
        run: npm ci

      # 4. Build the site
      - name: Build
        working-directory: ${{ env.SITE_DIR }}
        run: npm run build

      # 5. Authenticate to AWS via OIDC (no stored secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Sync built site to S3
      - name: Deploy to S3
        working-directory: ${{ env.SITE_DIR }}
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap*