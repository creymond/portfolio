name: Deploy Hugo Site

on:
  push:
    branches:
      - main
    paths:
      - "hugo-site-portfolio/**"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: true

# OIDC token permissions for AWS auth
permissions:
  id-token: write
  contents: read

env:
  HUGO_SITE_DIR: hugo-site-portfolio
  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Hugo
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # 3. Build the site
      - name: Build
        working-directory: ${{ env.HUGO_SITE_DIR }}
        run: hugo --minify

      # 4. Authenticate to AWS via OIDC (no stored secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 5. Sync built site to S3
      - name: Deploy to S3
        working-directory: ${{ env.HUGO_SITE_DIR }}
        run: |
          aws s3 sync public/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "sitemap.xml" \
            --exclude "robots.txt"

          aws s3 sync public/ s3://${{ env.S3_BUCKET }} \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "sitemap.xml" \
            --include "robots.txt" \
            --size-only

      # 6. Invalidate CloudFront cache
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
